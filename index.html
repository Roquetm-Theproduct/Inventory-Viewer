<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Product — Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   THE PRODUCT — inventory availability shell
   Fresh build. No Stoneworks data, no shared credentials.
   ============================================================ */

:root{
  --chrome:#1b1e22; --chrome-border:rgba(255,255,255,0.08); --chrome-text:#d8d5cd; --chrome-muted:#8b8f96;
  --paper:#f5f4f0; --card:#ffffff;
  --ink:#22262b; --ink-muted:#6b7280;
  --line:rgba(34,38,43,0.10); --line2:rgba(34,38,43,0.18);

  --brand:#a6741f; --brand-light:#c98f2a; --brand-dim:rgba(166,116,31,0.10);

  --in-stock:#2f7a55; --in-stock-dim:rgba(47,122,85,0.12);
  --low-stock:#c17f2a; --low-stock-dim:rgba(193,127,42,0.12);
  --out-stock:#a8432f; --out-stock-dim:rgba(168,67,47,0.12);
  --incoming:#3f6b8a; --incoming-dim:rgba(63,107,138,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-weight:400;min-height:100vh;}
.hidden{display:none !important;}
.app{display:flex;flex-direction:column;min-height:100vh;}

.display{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.3px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--brand);}

/* ---------- Top chrome ---------- */
.topnav{
  position:sticky;top:0;display:flex;align-items:center;
  background:var(--chrome);border-bottom:1px solid var(--chrome-border);
  padding:0 20px;height:58px;flex-shrink:0;z-index:500;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:28px;flex-shrink:0;}
.brand img{height:34px;width:34px;object-fit:cover;border-radius:50%;flex-shrink:0;}
.brand-text{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff;white-space:nowrap;}
.nav-tabs{display:flex;gap:0;flex:1;align-items:stretch;height:58px;}
.nav-tab{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:0 16px;height:58px;display:flex;align-items:center;
  background:none;border:none;color:var(--chrome-muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;
}
.nav-tab:hover{color:#fff;}
.nav-tab.active{color:var(--brand-light);border-bottom-color:var(--brand-light);}
.sync-status{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--chrome-muted);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--chrome-muted);}
.sync-dot.live{background:var(--in-stock);box-shadow:0 0 6px var(--in-stock);}
.sync-dot.error{background:var(--out-stock);}

/* ---------- Content ---------- */
.content{flex:1;padding:28px 28px 60px;max-width:1240px;width:100%;margin:0 auto;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:30px;letter-spacing:.3px;margin-top:2px;}
.page-sub{font-size:13px;color:var(--ink-muted);margin-top:2px;}

/* ---------- KPI strip ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);margin-bottom:24px;}
.kpi{background:var(--card);padding:18px 20px;}
.kpi-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px;}
.kpi-value{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:34px;line-height:1;}
.kpi-value.c-in{color:var(--in-stock);}
.kpi-value.c-low{color:var(--low-stock);}
.kpi-value.c-out{color:var(--out-stock);}

/* ---------- Table ---------- */
.table-card{background:var(--card);border:1px solid var(--line2);}
table{width:100%;border-collapse:collapse;}
thead th{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);
  background:var(--paper);
}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(34,38,43,0.02);}
.sku{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted);}
.qty{font-family:'IBM Plex Mono',monospace;font-weight:600;}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 10px;border-radius:2px;
}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-pill.in{background:var(--in-stock-dim);color:var(--in-stock);}
.status-pill.in .dot{background:var(--in-stock);}
.status-pill.low{background:var(--low-stock-dim);color:var(--low-stock);}
.status-pill.low .dot{background:var(--low-stock);}
.status-pill.out{background:var(--out-stock-dim);color:var(--out-stock);}
.status-pill.out .dot{background:var(--out-stock);}
.status-pill.incoming{background:var(--incoming-dim);color:var(--incoming);}
.status-pill.incoming .dot{background:var(--incoming);}

/* ---------- Stack meter (signature element) ----------
   Reads stock level as a row of solid blocks, like stacked
   slabs — filled blocks = stock on hand, out of 5 max. */
.stack-meter{display:inline-flex;gap:2px;vertical-align:middle;}
.stack-meter .block{width:9px;height:14px;background:var(--line2);}
.stack-meter .block.filled.in{background:var(--in-stock);}
.stack-meter .block.filled.low{background:var(--low-stock);}
.stack-meter .block.filled.out{background:var(--out-stock);}

/* ---------- Buttons ---------- */
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:10px 20px;border:none;cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--brand);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--brand-light);}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink-muted);}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Login screen ---------- */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--chrome);padding:24px;
}
.login-card{
  width:100%;max-width:380px;background:#22262b;border:1px solid var(--chrome-border);
  padding:40px 36px 32px;text-align:center;
}
.login-logo{width:88px;height:88px;object-fit:cover;border-radius:50%;margin:0 auto 18px;display:block;}
.login-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;color:#fff;letter-spacing:.5px;}
.login-sub{font-size:11px;color:var(--chrome-muted);margin-top:2px;margin-bottom:26px;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;}
.login-field{margin-bottom:14px;text-align:left;}
.login-field label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--chrome-muted);display:block;margin-bottom:5px;
}
.login-field input{
  width:100%;background:#1b1e22;border:1px solid var(--chrome-border);color:#fff;
  padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;
}
.login-field input:focus{border-color:var(--brand-light);}
.login-btn{width:100%;justify-content:center;margin-top:8px;padding:12px;font-size:12px;}
.login-error{font-size:12px;color:var(--out-stock);margin-top:14px;font-family:'IBM Plex Mono',monospace;display:none;}
.login-footer{margin-top:24px;padding-top:18px;border-top:1px solid var(--chrome-border);font-size:11px;color:var(--chrome-muted);}

/* ---------- Setup notice ---------- */
.setup-banner{
  background:var(--brand-dim);border:1px solid var(--brand);color:var(--brand);
  padding:14px 18px;font-size:12px;line-height:1.6;margin-bottom:20px;text-align:left;
}
.setup-banner code{background:rgba(0,0,0,0.06);padding:1px 6px;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.sample-note{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:12px;}

/* ---------- Search / filter toolbar ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search-input{
  flex:1;min-width:200px;background:var(--card);border:1px solid var(--line2);color:var(--ink);
  padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;
}
.search-input:focus{border-color:var(--brand);}
.search-input::placeholder{color:var(--ink-muted);}
.filter-select{
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  padding:9px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;outline:none;cursor:pointer;
}
.filter-select:focus{border-color:var(--brand);}
.no-results{padding:32px 16px;text-align:center;color:var(--ink-muted);font-size:13px;}

@media (max-width: 640px){
  .nav-tabs{overflow-x:auto;}
  .brand-text{display:none;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ════════════════════════════════════════════════════════════
   SUPABASE CONFIG
   Fill these in with YOUR new project's values from:
   Supabase Dashboard → Project Settings → API
   Do NOT reuse another project's URL or key here.
   ════════════════════════════════════════════════════════════ */
const SUPA_URL = 'https://cwhbchoffrtmjciiywps.supabase.co';
const SUPA_KEY = 'sb_publishable_q7FXk6h1FgHR8kNTUHZFdA_B7BxaUq5';   // publishable key — safe for client-side code

const LOGO_SRC = 'assets/logo.png';
const BRAND_NAME = 'The Product';

/* ════════════════════════════════════════════════════════════
   Minimal app shell — login + inventory dashboard.
   Table below is SAMPLE DATA only, to preview the layout.
   Swap for a real query once Supabase is connected.
   ════════════════════════════════════════════════════════════ */

const root = document.getElementById('root');
const isConfigured = SUPA_URL && SUPA_KEY;
const sb = isConfigured ? supabase.createClient(SUPA_URL, SUPA_KEY) : null;

// level: 0-5, used to drive the stack meter + status
const SAMPLE_INVENTORY = [
  { sku:'GRN-SLB-3CM', name:'Granite Slab — 3cm, Polished', location:'Yard A / Bay 3', qty:142, level:5, status:'in' },
  { sku:'MRB-TIL-12', name:'Marble Tile — 12x12', location:'Warehouse / Rack 7', qty:38, level:2, status:'low' },
  { sku:'BLU-GRV-3/4', name:'Blue Gravel — 3/4"', location:'Yard B / Pile 1', qty:0, level:0, status:'out' },
  { sku:'LMS-BLK-STD', name:'Limestone Block — Standard', location:'Yard A / Bay 1', qty:76, level:4, status:'in' },
  { sku:'SND-FIL-BLK', name:'Fill Sand — Bulk', location:'Yard C', qty:12, level:1, status:'low' },
  { sku:'TRV-TIL-16', name:'Travertine Tile — 16x16', location:'Warehouse / Rack 2', qty:0, level:0, status:'incoming' },
];

function levelFromQty(qty){
  if (qty <= 0) return 0;
  return Math.min(5, Math.max(1, Math.ceil(qty / 30)));
}

function stackMeter(level, status){
  let blocks = '';
  for (let i = 0; i < 5; i++){
    blocks += `<span class="block ${i < level ? 'filled ' + status : ''}"></span>`;
  }
  return `<span class="stack-meter">${blocks}</span>`;
}

function statusPill(status){
  const labels = { in:'In Stock', low:'Low', out:'Out of Stock', incoming:'Incoming' };
  return `<span class="status-pill ${status}"><span class="dot"></span>${labels[status]}</span>`;
}

function renderSetupBanner(){
  if (isConfigured) return '';
  return `
    <div class="setup-banner">
      <strong>Setup needed:</strong> Supabase isn't connected yet. Open this file and fill in
      <code>SUPA_URL</code> and <code>SUPA_KEY</code> near the top of the &lt;script&gt; tag with
      your new Supabase project's values (Project Settings → API).
    </div>`;
}

function showLoginScreen(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img src="${LOGO_SRC}" class="login-logo" alt="${BRAND_NAME}"/>
        <div class="login-title">${BRAND_NAME}</div>
        <div class="login-sub">Inventory Availability</div>

        <form id="login-form">
          <div class="login-field">
            <label>Email</label>
            <input type="email" id="login-email" autocomplete="email" required/>
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required/>
          </div>
          <button type="submit" class="btn btn-primary login-btn" ${isConfigured ? '' : 'disabled'}>
            Sign In
          </button>
        </form>
        <div class="login-error" id="login-error"></div>
        <div class="login-footer">The Product</div>
      </div>
    </div>`;

  document.getElementById('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const err = document.getElementById('login-error');
    err.style.display = 'none';

    if (!isConfigured){
      err.textContent = 'Add your Supabase project details first (see setup notice).';
      err.style.display = 'block';
      return;
    }

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing In…';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';

    if (error){
      err.textContent = error.message;
      err.style.display = 'block';
      return;
    }
    showAppShell();
  });
}

let currentInventory = [];

function renderRows(items){
  if (items.length === 0){
    return `<tr><td colspan="6" class="no-results">No items match your search.</td></tr>`;
  }
  return items.map(item => `
    <tr>
      <td class="sku">${item.sku}</td>
      <td>${item.name}</td>
      <td style="color:var(--ink-muted);">${item.location}</td>
      <td class="qty">${item.qty}</td>
      <td>${stackMeter(item.level, item.status === 'incoming' ? 'low' : item.status)}</td>
      <td>${statusPill(item.status)}</td>
    </tr>`).join('');
}

function applyFilters(){
  const q = document.getElementById('inv-search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('inv-status-filter').value;

  const filtered = currentInventory.filter(item => {
    const matchesQuery = !q ||
      item.sku.toLowerCase().includes(q) ||
      item.name.toLowerCase().includes(q) ||
      (item.location || '').toLowerCase().includes(q);
    const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
    return matchesQuery && matchesStatus;
  });

  document.getElementById('inv-tbody').innerHTML = renderRows(filtered);
}

async function showAppShell(){
  let inventory = SAMPLE_INVENTORY;
  let usingSample = true;

  if (isConfigured){
    const { data, error } = await sb.from('inventory').select('*').order('sku');
    if (!error && data){
      inventory = data.map(row => ({ ...row, level: levelFromQty(row.qty) }));
      usingSample = false;
    }
  }

  currentInventory = inventory;

  const total = inventory.length;
  const inStock = inventory.filter(i => i.status === 'in').length;
  const low = inventory.filter(i => i.status === 'low').length;
  const out = inventory.filter(i => i.status === 'out').length;

  const rows = renderRows(inventory);

  root.innerHTML = `
    <div class="app">
      <div class="topnav">
        <div class="brand">
          <img src="${LOGO_SRC}" alt="${BRAND_NAME}"/>
          <span class="brand-text">${BRAND_NAME}</span>
        </div>
        <div class="nav-tabs">
          <button class="nav-tab active">Inventory</button>
        </div>
        <div class="sync-status">
          <span class="sync-dot ${isConfigured ? 'live' : 'error'}"></span>
          ${isConfigured ? 'Connected' : 'Not configured'}
        </div>
        <button class="btn btn-ghost" id="sign-out-btn" style="margin-left:16px;">Sign Out</button>
      </div>
      <div class="content">
        <div class="page-header">
          <div>
            <div class="eyebrow">Live Availability</div>
            <div class="page-title">Inventory</div>
            <div class="page-sub">What's on hand, where it is, and what's running low.</div>
          </div>
        </div>

        ${renderSetupBanner()}

        <div class="kpi-grid">
          <div class="kpi">
            <div class="kpi-label">Total SKUs</div>
            <div class="kpi-value">${total}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">In Stock</div>
            <div class="kpi-value c-in">${inStock}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Low Stock</div>
            <div class="kpi-value c-low">${low}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Out of Stock</div>
            <div class="kpi-value c-out">${out}</div>
          </div>
        </div>

        ${usingSample ? '<div class="sample-note">Sample data — inventory table not reachable, showing placeholder rows</div>' : ''}

        <div class="toolbar">
          <input type="text" id="inv-search" class="search-input" placeholder="Search by SKU, product, or location…"/>
          <select id="inv-status-filter" class="filter-select">
            <option value="all">All Statuses</option>
            <option value="in">In Stock</option>
            <option value="low">Low Stock</option>
            <option value="out">Out of Stock</option>
            <option value="incoming">Incoming</option>
          </select>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Product</th>
                <th>Location</th>
                <th>Qty</th>
                <th>Stock Level</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="inv-tbody">${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  document.getElementById('sign-out-btn').addEventListener('click', async function(){
    if (sb) await sb.auth.signOut();
    showLoginScreen();
  });
  document.getElementById('inv-search').addEventListener('input', applyFilters);
  document.getElementById('inv-status-filter').addEventListener('change', applyFilters);
}

async function init(){
  if (isConfigured){
    const { data } = await sb.auth.getSession();
    if (data.session){
      showAppShell();
      return;
    }
  }
  showLoginScreen();
}

init();
</script>
</body>
</html>
