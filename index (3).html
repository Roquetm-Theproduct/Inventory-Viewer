<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Product — Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   THE PRODUCT — inventory availability shell
   Fresh build. No Stoneworks data, no shared credentials.
   ============================================================ */

:root{
  --chrome:#1b1e22; --chrome-border:rgba(255,255,255,0.08); --chrome-text:#d8d5cd; --chrome-muted:#8b8f96;
  --paper:#f5f4f0; --card:#ffffff;
  --ink:#22262b; --ink-muted:#6b7280;
  --line:rgba(34,38,43,0.10); --line2:rgba(34,38,43,0.18);

  --brand:#a6741f; --brand-light:#c98f2a; --brand-dim:rgba(166,116,31,0.10);

  --in-stock:#2f7a55; --in-stock-dim:rgba(47,122,85,0.12);
  --low-stock:#c17f2a; --low-stock-dim:rgba(193,127,42,0.12);
  --out-stock:#a8432f; --out-stock-dim:rgba(168,67,47,0.12);
  --incoming:#3f6b8a; --incoming-dim:rgba(63,107,138,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-weight:400;min-height:100vh;}
.hidden{display:none !important;}
.app{display:flex;flex-direction:column;min-height:100vh;}

.display{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.3px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--brand);}

/* ---------- Top chrome ---------- */
.topnav{
  position:sticky;top:0;display:flex;align-items:center;
  background:var(--chrome);border-bottom:1px solid var(--chrome-border);
  padding:0 20px;height:58px;flex-shrink:0;z-index:500;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:28px;flex-shrink:0;}
.brand img{height:34px;width:34px;object-fit:cover;border-radius:50%;flex-shrink:0;}
.brand-text{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff;white-space:nowrap;}
.client-divider{font-size:11px;color:var(--chrome-muted);margin:0 6px;flex-shrink:0;}
.client-logo{height:24px;width:auto;object-fit:contain;flex-shrink:0;}
.client-logo-login{height:26px;width:auto;object-fit:contain;}
.nav-tabs{display:flex;gap:0;flex:1;align-items:stretch;height:58px;}
.nav-tab{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:0 16px;height:58px;display:flex;align-items:center;
  background:none;border:none;color:var(--chrome-muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;
}
.nav-tab:hover{color:#fff;}
.nav-tab.active{color:var(--brand-light);border-bottom-color:var(--brand-light);}
.sync-status{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--chrome-muted);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--chrome-muted);}
.sync-dot.live{background:var(--in-stock);box-shadow:0 0 6px var(--in-stock);}
.sync-dot.error{background:var(--out-stock);}

/* ---------- Content ---------- */
.content{flex:1;padding:28px 28px 60px;max-width:1240px;width:100%;margin:0 auto;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:30px;letter-spacing:.3px;margin-top:2px;}
.page-sub{font-size:13px;color:var(--ink-muted);margin-top:2px;}

/* ---------- Filter bar (multi-select dropdowns) ---------- */
.msel{position:relative;}
.msel-btn{
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  padding:9px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.msel-btn:hover{border-color:var(--brand);}
.msel-btn.active{border-color:var(--brand);color:var(--brand);}
.msel-count{background:var(--brand);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;line-height:1.5;}
.msel-caret{opacity:.55;font-size:10px;}
.msel-panel{
  position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--line2);
  box-shadow:0 10px 28px rgba(0,0,0,0.14);min-width:190px;max-height:260px;overflow-y:auto;
  z-index:200;padding:6px 0;display:none;
}
.msel-panel.open{display:block;}
.msel-option{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:13px;cursor:pointer;}
.msel-option:hover{background:var(--paper);}
.msel-option input{cursor:pointer;accent-color:var(--brand);}
.msel-empty{padding:10px 12px;font-size:12px;color:var(--ink-muted);}
.msel-clear{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--brand);padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;margin-top:4px;
}

/* ---------- Table ---------- */
.table-card{background:var(--card);border:1px solid var(--line2);}
table{width:100%;border-collapse:collapse;}
thead th{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);
  background:var(--paper);
}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(34,38,43,0.02);}
.sku{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted);}
.qty{font-family:'IBM Plex Mono',monospace;font-weight:600;}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 10px;border-radius:2px;
}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-pill.in{background:var(--in-stock-dim);color:var(--in-stock);}
.status-pill.in .dot{background:var(--in-stock);}
.status-pill.low{background:var(--low-stock-dim);color:var(--low-stock);}
.status-pill.low .dot{background:var(--low-stock);}
.status-pill.out{background:var(--out-stock-dim);color:var(--out-stock);}
.status-pill.out .dot{background:var(--out-stock);}
.status-pill.incoming{background:var(--incoming-dim);color:var(--incoming);}
.status-pill.incoming .dot{background:var(--incoming);}

/* ---------- Stack meter (signature element) ----------
   Reads stock level as a row of solid blocks, like stacked
   slabs — filled blocks = stock on hand, out of 5 max. */
.stack-meter{display:inline-flex;gap:2px;vertical-align:middle;}
.stack-meter .block{width:9px;height:14px;background:var(--line2);}
.stack-meter .block.filled.in{background:var(--in-stock);}
.stack-meter .block.filled.low{background:var(--low-stock);}
.stack-meter .block.filled.out{background:var(--out-stock);}

/* ---------- Buttons ---------- */
.btn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:10px 20px;border:none;cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:var(--brand);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--brand-light);}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink-muted);}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Login screen ---------- */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--chrome);padding:24px;
}
.login-card{
  width:100%;max-width:380px;background:#22262b;border:1px solid var(--chrome-border);
  padding:40px 36px 32px;text-align:center;
}
.login-logo{width:88px;height:88px;object-fit:cover;border-radius:50%;margin:0 auto 18px;display:block;}
.login-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;color:#fff;letter-spacing:.5px;}
.login-sub{font-size:11px;color:var(--chrome-muted);margin-top:2px;margin-bottom:26px;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;}
.login-field{margin-bottom:14px;text-align:left;}
.login-field label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--chrome-muted);display:block;margin-bottom:5px;
}
.login-field input{
  width:100%;background:#1b1e22;border:1px solid var(--chrome-border);color:#fff;
  padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;
}
.login-field input:focus{border-color:var(--brand-light);}
.login-btn{width:100%;justify-content:center;margin-top:8px;padding:12px;font-size:12px;}
.login-error{font-size:12px;color:var(--out-stock);margin-top:14px;font-family:'IBM Plex Mono',monospace;display:none;}
.login-footer{margin-top:24px;padding-top:18px;border-top:1px solid var(--chrome-border);font-size:11px;color:var(--chrome-muted);}

/* ---------- Setup notice ---------- */
.setup-banner{
  background:var(--brand-dim);border:1px solid var(--brand);color:var(--brand);
  padding:14px 18px;font-size:12px;line-height:1.6;margin-bottom:20px;text-align:left;
}
.setup-banner code{background:rgba(0,0,0,0.06);padding:1px 6px;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.sample-note{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:12px;}

/* ---------- Search / filter toolbar ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search-input{
  flex:1;min-width:200px;background:var(--card);border:1px solid var(--line2);color:var(--ink);
  padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;
}
.search-input:focus{border-color:var(--brand);}
.search-input::placeholder{color:var(--ink-muted);}
.filter-select{
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  padding:9px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;outline:none;cursor:pointer;
}
.filter-select:focus{border-color:var(--brand);}
.no-results{padding:32px 16px;text-align:center;color:var(--ink-muted);font-size:13px;}

/* ---------- Simple checkbox filter ---------- */
.checkbox-filter{
  display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line2);
  padding:9px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;cursor:pointer;
}
.checkbox-filter:hover{border-color:var(--brand);}
.checkbox-filter input{cursor:pointer;accent-color:var(--brand);}
.checkbox-filter.active{border-color:var(--brand);color:var(--brand);}

.paired-link{
  color:var(--brand);text-decoration:underline;cursor:pointer;background:none;border:none;
  font-size:14px;font-family:'Inter',sans-serif;padding:0;
}
.paired-link:hover{color:var(--brand-light);}

/* ---------- Thumbnail (hover to zoom) ---------- */
.thumb-cell{width:56px;}
.thumb{
  width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line2);
  background:var(--paper);cursor:zoom-in;
  transition:transform .18s ease, box-shadow .18s ease;
  transform-origin:center left;
  position:relative;
}
.thumb:hover{
  transform:scale(3.2);
  box-shadow:0 10px 28px rgba(0,0,0,0.35);
  z-index:50;
  border-color:var(--brand);
}
.row-clickable{cursor:pointer;}
.status-editor{
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  padding:5px 8px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;outline:none;
}
.status-editor:focus{border-color:var(--brand);}

/* ---------- Item detail modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,17,13,0.62);display:none;
  align-items:center;justify-content:center;z-index:1000;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-card{
  background:var(--card);max-width:720px;width:100%;max-height:88vh;overflow-y:auto;
  border:1px solid var(--line2);
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--card);z-index:2;
}
.modal-header-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;}
.modal-header-sku{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-muted);}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-muted);line-height:1;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:24px;}

.gallery-main{width:100%;aspect-ratio:4/3;object-fit:contain;border:1px solid var(--line2);background:var(--paper);}
.gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.gallery-thumb{width:56px;height:56px;object-fit:cover;border:2px solid transparent;cursor:pointer;border-radius:3px;}
.gallery-thumb.active{border-color:var(--brand);}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-top:22px;}
.detail-field label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-muted);display:block;margin-bottom:3px;
}
.detail-field div{font-size:14px;}

.modal-status-section{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
.modal-field{margin-bottom:14px;}
.modal-field label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-muted);display:block;margin-bottom:6px;
}
.modal-field input, .modal-field select{
  width:100%;background:var(--paper);border:1px solid var(--line2);color:var(--ink);
  padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;
}
.modal-actions{display:flex;gap:10px;margin-top:20px;align-items:center;}
.modal-note{font-size:12px;color:var(--ink-muted);margin-top:16px;}

.special-badge{color:var(--brand);margin-left:4px;}

/* ---------- View toggle ---------- */
.view-toggle{display:inline-flex;border:1px solid var(--line2);}
.view-toggle-btn{
  background:var(--card);border:none;color:var(--ink-muted);font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:1px;padding:9px 14px;cursor:pointer;border-right:1px solid var(--line2);
}
.view-toggle-btn:last-child{border-right:none;}
.view-toggle-btn.active{background:var(--brand);color:#fff;}
.view-toggle-btn:hover:not(.active){color:var(--brand);}

/* ---------- Grid view ---------- */
.grid-wrap{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:16px;}
.grid-card{background:var(--card);border:1px solid var(--line2);cursor:pointer;overflow:hidden;transition:border-color .15s;}
.grid-card:hover{border-color:var(--brand);}
.grid-card-photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--paper);display:block;}
.grid-card-body{padding:12px 14px;}
.grid-card-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.grid-card-meta{font-size:11px;color:var(--ink-muted);margin-bottom:10px;}
.grid-card-footer{display:flex;justify-content:space-between;align-items:center;}
.grid-pagination{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:22px;}
.grid-page-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-muted);}

/* ---------- Browse (single-item flip-through) view ---------- */
.browse-stage{background:var(--card);border:1px solid var(--line2);padding:28px;text-align:center;}
.browse-stage-photo{max-width:100%;max-height:420px;object-fit:contain;cursor:pointer;margin:0 auto;display:block;}
.browse-stage-body{margin-top:18px;text-align:left;max-width:480px;margin-left:auto;margin-right:auto;}
.browse-stage-name{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;}
.browse-stage-meta{font-size:12px;color:var(--ink-muted);margin-top:4px;}
.browse-nav{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:20px;}
.browse-counter{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted);}

@media (max-width: 640px){
  .nav-tabs{overflow-x:auto;}
  .brand-text{display:none;}
}
</style>
</head>

// Active multi-select filter state, one Set per filter dimension
const FILTER_STATE = { color:new Set(), location:new Set(), style:new Set(), finish:new Set(), price:new Set() };

function levelFromQty(qty){
  if (qty <= 0) return 0;
  return Math.min(5, Math.max(1, Math.ceil(qty / 30)));
}

function stackMeter(level, status){
  let blocks = '';
  for (let i = 0; i < 5; i++){
    blocks += `<span class="block ${i < level ? 'filled ' + status : ''}"></span>`;
  }
  return `<span class="stack-meter">${blocks}</span>`;
}

function statusPill(status){
  const labels = { available:'Available', reserved:'Reserved', sold:'Sold' };
  const classes = { available:'in', reserved:'low', sold:'out' };
  return `<span class="status-pill ${classes[status] || 'in'}"><span class="dot"></span>${labels[status] || status}</span>`;
}

let currentUserRole = 'sales'; // default to least-privileged until we confirm otherwise

async function loadCurrentUserRole(){
  if (!sb) return 'sales';
  const { data: sessionData } = await sb.auth.getSession();
  if (!sessionData.session) return 'sales';
  const { data, error } = await sb.from('profiles').select('role').eq('id', sessionData.session.user.id).single();
  if (error || !data) return 'sales';
  return data.role;
}

function showLoginScreen(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img src="${LOGO_SRC}" class="login-logo" alt="${BRAND_NAME}"/>
        <div class="login-title">${BRAND_NAME}</div>

            <input type="password" id="login-password" autocomplete="current-password" required/>
          </div>

let currentInventory = [];
let currentView = 'grid';
let gridPage = 0;
let browseIndex = 0;
const GRID_PAGE_SIZE = 12;

function uniqueValues(field){
  return [...new Set(currentInventory.map(i => i[field]).filter(Boolean))].sort();
}

function renderMultiSelect(key, label, options){
  const selected = FILTER_STATE[key];
  const count = selected.size;
  const optsHtml = options.length
    ? options.map(opt => `
        <label class="msel-option">
          <input type="checkbox" data-filter="${key}" value="${opt.value}" ${selected.has(opt.value) ? 'checked' : ''}/>
          ${opt.label}
        </label>`).join('')
    : `<div class="msel-empty">No values yet</div>`;

  return `
    <div class="msel" data-msel="${key}">
      <button type="button" class="msel-btn ${count ? 'active' : ''}" data-toggle="${key}">
        ${label}${count ? `<span class="msel-count">${count}</span>` : ''}
        <span class="msel-caret">▾</span>
      </button>
      <div class="msel-panel" id="msel-panel-${key}">
        ${optsHtml}
        ${count ? `<div class="msel-clear" data-clear="${key}">Clear</div>` : ''}
      </div>
    </div>`;
}

function updateFilterButton(key){
  const container = document.querySelector(`[data-msel="${key}"]`);
  if (!container) return;
  const btn = container.querySelector('.msel-btn');
  const count = FILTER_STATE[key].size;
  const label = btn.dataset.label || btn.textContent.trim().replace(/\d+$/, '').trim();
  btn.dataset.label = label;
  btn.classList.toggle('active', count > 0);
  btn.innerHTML = `${label}${count ? `<span class="msel-count">${count}</span>` : ''}<span class="msel-caret">▾</span>`;

  const panel = container.querySelector('.msel-panel');
  const existingClear = panel.querySelector('.msel-clear');
  if (count && !existingClear){
    panel.insertAdjacentHTML('beforeend', `<div class="msel-clear" data-clear="${key}">Clear</div>`);
  } else if (!count && existingClear){
    existingClear.remove();
  }
}

function formatDate(iso){
  if (!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { month:'numeric', day:'numeric', year:'numeric' });
}

function statusSubtext(item){
  if (item.status === 'reserved' && item.held_by){
    const dateStr = item.reserved_at ? ` — ${formatDate(item.reserved_at)}` : '';
    return `<div style="font-size:10px;color:var(--ink-muted);margin-top:3px;">Reserved: ${item.held_by}${dateStr}</div>`;
  }
  if (item.status === 'sold' && item.order_number) {
    const typeLabel = item.order_type === 'transfer_order' ? 'Transfer #' : 'Sales Order #';
    return `<div style="font-size:10px;color:var(--ink-muted);margin-top:3px;">${typeLabel}${item.order_number}</div>`;
  }
  return '';
}

function renderRows(items, viewingArchive){
  if (items.length === 0){
    return `<tr><td colspan="9" class="no-results">${viewingArchive ? 'No archived items.' : 'No items match your search.'}</td></tr>`;
  }
  return items.map(item => `
    <tr class="row-clickable" data-sku="${item.sku}">
      <td class="thumb-cell"><img class="thumb" src="${item.image_url || PLACEHOLDER_THUMB}" alt="${item.name}"/></td>
      <td class="sku">${item.sku}</td>
      <td>${item.name}${item.is_special ? '<span class="special-badge">★</span>' : ''}</td>
      <td>${item.style || '—'}</td>
      <td class="qty">${item.qty}</td>
      <td style="color:var(--ink-muted);">${item.location || '—'}</td>
      <td class="sku">${item.bin_number || '—'}</td>
      <td class="qty">${typeof item.retail_price === 'number' ? '$' + item.retail_price.toFixed(2) : '—'}</td>
      <td>${statusPill(item.status)}${statusSubtext(item)}</td>
    </tr>`).join('');
}

/* ---------- Item detail modal ---------- */
let modalGalleryIndex = 0;

function ensureModalRoot(){
  let overlay = document.getElementById('modal-overlay');
  if (!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if (e.target === overlay) closeItemModal();
    });
  }
  return overlay;
}

async function findItemForModal(sku){
  const local = currentInventory.find(i => i.sku === sku);
  if (local) return local;
  if (!sb) return null;
  const { data, error } = await sb.from('inventory').select('*').eq('sku', sku).single();
  if (error || !data) return null;
  return data;
}

function pairedWithHtml(item){
  if (!item.paired_sku) return '—';
  return `<button class="paired-link" data-open-sku="${item.paired_sku}">${item.paired_sku} →</button>`;
}

async function openItemModal(sku){
  const item = await findItemForModal(sku);
  if (!item){
    alert('Item not found.');
    return;
  }
  modalGalleryIndex = 0;

  const overlay = ensureModalRoot();
  const photos = [item.image_url, ...(item.photo_urls || [])].filter(Boolean);
  const displayPhotos = photos.length ? photos : [PLACEHOLDER_THUMB];

  const thumbsHtml = displayPhotos.map((url, i) =>
    `<img src="${url}" class="gallery-thumb ${i === 0 ? 'active' : ''}" data-index="${i}"/>`
  ).join('');

  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-header-title">${item.name}${item.is_special ? '<span class="special-badge">★</span>' : ''}</div>
          <div class="modal-header-sku">${item.sku}</div>
        </div>
        <button class="modal-close" id="modal-close-btn">×</button>
      </div>
      <div class="modal-body">
        <img id="modal-gallery-main" class="gallery-main" src="${displayPhotos[0]}"/>
        ${displayPhotos.length > 1 ? `<div class="gallery-thumbs" id="modal-gallery-thumbs">${thumbsHtml}</div>` : ''}

        <div class="detail-grid">
          <div class="detail-field"><label>Style</label><div>${item.style || '—'}</div></div>
          <div class="detail-field"><label>Color</label><div>${item.color || '—'}</div></div>
          <div class="detail-field"><label>Finish</label><div>${item.finish || '—'}</div></div>
          <div class="detail-field"><label>Retail Price</label><div>${typeof item.retail_price === 'number' ? '$' + item.retail_price.toFixed(2) : '—'}</div></div>
          <div class="detail-field"><label>Quantity</label><div>${item.qty}</div></div>
          <div class="detail-field"><label>Location</label><div>${item.location || '—'}</div></div>
          <div class="detail-field"><label>Bin #</label><div>${item.bin_number || '—'}</div></div>
          <div class="detail-field"><label>Status</label><div>${statusPill(item.status)}</div></div>
          <div class="detail-field"><label>Core Hole</label><div>${item.has_core_hole ? `Yes${item.core_hole_qty ? ' (Qty: ' + item.core_hole_qty + ')' : ''}` : 'No'}</div></div>
          <div class="detail-field"><label>Paired With</label><div id="modal-paired-with">${pairedWithHtml(item)}</div></div>
        </div>

        <div class="modal-status-section">
          ${item.status === 'reserved' && item.held_by ? `<div class="modal-note">Reserved by <strong>${item.held_by}</strong>${item.reserved_at ? ' on <strong>' + formatDate(item.reserved_at) + '</strong>' : ''}</div>` : ''}
          ${item.status === 'sold' && item.order_number ? `<div class="modal-note">Sold by <strong>${item.held_by || '—'}</strong> — ${item.order_type === 'transfer_order' ? 'Transfer' : 'Sales'} Order #: <strong>${item.order_number}</strong></div>` : ''}

          ${item.status === 'available' ? `
            <button class="btn btn-primary" id="modal-reserve-btn">Reserve This Item</button>
          ` : ''}
          ${item.status === 'reserved' ? `
            <button class="btn btn-ghost" id="modal-unreserve-btn">Make Available Again</button>
          ` : ''}
          ${item.status !== 'sold' ? `
            <button class="btn btn-ghost" id="modal-sold-btn" style="margin-left:8px;">Mark as Sold</button>
          ` : ''}

          <div class="hidden" id="modal-reserve-form" style="margin-top:14px;">
            <div class="modal-field">
              <label>Store</label>
              <select id="modal-reserve-store">
                <option value="">Select a store…</option>
                ${STORE_OPTIONS.map(s => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>
            <div class="modal-actions">
              <button class="btn btn-primary" id="modal-reserve-confirm-btn">Confirm Reservation</button>
              <button class="btn btn-ghost" id="modal-reserve-cancel-btn">Cancel</button>
            </div>
            <div id="modal-reserve-msg" class="modal-note"></div>
          </div>

          <div class="hidden" id="modal-sold-form" style="margin-top:14px;">
            <div class="modal-field">
              <label>Store</label>
              <select id="modal-sold-store">
                <option value="">Select a store…</option>
                ${STORE_OPTIONS.map(s => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>
            <div class="modal-field">
              <label>Order Type</label>
              <select id="modal-sold-order-type">
                <option value="sales_order">Sales Order</option>
                <option value="transfer_order">Transfer Order</option>
              </select>
            </div>
            <div class="modal-field">
              <label>Order Number</label>
              <input type="text" id="modal-sold-order-number" placeholder="e.g. SO-10493"/>

            <div class="modal-field">
              <label>Sale Price ($)</label>
              <input type="number" step="0.01" id="modal-sold-price" value="${typeof item.retail_price === 'number' ? item.retail_price.toFixed(2) : ''}"/>

              <button class="btn btn-primary" id="modal-sold-confirm-btn">Confirm Sale</button>

      </div>

      const thumb = e.target.closest('.gallery-thumb');
      if (!thumb) return;
      const i = parseInt(thumb.dataset.index, 10);
      document.getElementById('modal-gallery-main').src = displayPhotos[i];
      overlay.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    });
  }

  const pairedEl = document.getElementById('modal-paired-with');
  if (pairedEl){
    pairedEl.addEventListener('click', function(e){
      const link = e.target.closest('[data-open-sku]');
      if (!link) return;
      openItemModal(link.dataset.openSku);
    });
  }

  const reserveBtn = document.getElementById('modal-reserve-btn');
  if (reserveBtn){
    reserveBtn.addEventListener('click', function(){
      document.getElementById('modal-reserve-form').classList.remove('hidden');
      reserveBtn.classList.add('hidden');
    });
    document.getElementById('modal-reserve-cancel-btn').addEventListener('click', function(){
      document.getElementById('modal-reserve-form').classList.add('hidden');
      reserveBtn.classList.remove('hidden');
    });
    document.getElementById('modal-reserve-confirm-btn').addEventListener('click', () => confirmReserve(item.sku));
  }

  const unreserveBtn = document.getElementById('modal-unreserve-btn');
  if (unreserveBtn) unreserveBtn.addEventListener('click', () => confirmMakeAvailable(item.sku));

  const soldBtn = document.getElementById('modal-sold-btn');
  if (soldBtn){
    soldBtn.addEventListener('click', function(){
      document.getElementById('modal-sold-form').classList.remove('hidden');
      soldBtn.classList.add('hidden');
    });
    document.getElementById('modal-sold-cancel-btn').addEventListener('click', function(){
      document.getElementById('modal-sold-form').classList.add('hidden');
      soldBtn.classList.remove('hidden');
    });
    document.getElementById('modal-sold-confirm-btn').addEventListener('click', () => confirmMarkSold(item.sku));
  }

async function confirmReserve(sku){
  const store = document.getElementById('modal-reserve-store').value;
  const msg = document.getElementById('modal-reserve-msg');
  if (!store){
    msg.textContent = 'Please select a store.';
    msg.style.color = 'var(--out-stock)';
    return;
  }

  const { error } = await sb.rpc('reserve_item', { p_sku: sku, p_held_by: store });
  if (error){
    msg.textContent = error.message || 'Could not reserve this item.';
    msg.style.color = 'var(--out-stock)';
    return;
  }

  closeItemModal();
  showAppShell();
}

async function confirmMakeAvailable(sku){
  if (!confirm('Make this item available again?')) return;
  const { error } = await sb.rpc('make_available', { p_sku: sku });
  if (error){
    alert(error.message || 'Could not update this item.');
    return;
  }
  closeItemModal();
  showAppShell();
}

async function confirmMarkSold(sku){
  const store = document.getElementById('modal-sold-store').value;
  const orderType = document.getElementById('modal-sold-order-type').value;
  const orderNumber = document.getElementById('modal-sold-order-number').value.trim();
  const soldPriceInput = document.getElementById('modal-sold-price').value;
  const msg = document.getElementById('modal-sold-msg');

  if (!store){
    msg.textContent = 'Please select a store.';
    msg.style.color = 'var(--out-stock)';
    return;
  }

  const { error } = await sb.rpc('mark_sold', {
    p_sku: sku, p_store: store, p_order_type: orderType, p_order_number: orderNumber || null,
    p_sold_price: soldPriceInput ? parseFloat(soldPriceInput) : null
  });
  if (error){
    msg.textContent = error.message || 'Could not mark this item sold.';
    msg.style.color = 'var(--out-stock)';
    return;
  }

  closeItemModal();
  showAppShell();
}

function closeItemModal(){
  const overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.classList.remove('open');
}

function getFilteredItems(){
  const q = document.getElementById('inv-search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('inv-status-filter').value;
  const coreHoleOnly = document.getElementById('inv-core-hole-filter').checked;
  const specialsOnly = document.getElementById('inv-specials-filter').checked;

  return currentInventory.filter(item => {
    const matchesQuery = !q ||
      item.sku.toLowerCase().includes(q) ||
      item.name.toLowerCase().includes(q) ||
      (item.location || '').toLowerCase().includes(q);
    const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
    const matchesColor = FILTER_STATE.color.size === 0 || FILTER_STATE.color.has(item.color);
    const matchesLocation = FILTER_STATE.location.size === 0 || FILTER_STATE.location.has(item.location);
    const matchesStyle = FILTER_STATE.style.size === 0 || FILTER_STATE.style.has(item.style);
    const matchesFinish = FILTER_STATE.finish.size === 0 || FILTER_STATE.finish.has(item.finish);
    const matchesPrice = FILTER_STATE.price.size === 0 || [...FILTER_STATE.price].some(bandKey => {
      const band = PRICE_BANDS.find(b => b.key === bandKey);
      return band && typeof item.retail_price === 'number' && band.test(item.retail_price);
    });
    const matchesCoreHole = !coreHoleOnly || item.has_core_hole === true;
    const matchesSpecial = !specialsOnly || item.is_special === true;
    return matchesQuery && matchesStatus && matchesColor && matchesLocation && matchesStyle && matchesFinish && matchesPrice && matchesCoreHole && matchesSpecial;
  });
}

function renderGridView(items){
  const wrap = document.getElementById('grid-wrap');
  const pag = document.getElementById('grid-pagination');
  if (!wrap) return;

  if (items.length === 0){
    wrap.innerHTML = `<div class="no-results">No items match your search.</div>`;
    pag.innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(items.length / GRID_PAGE_SIZE));
  if (gridPage >= totalPages) gridPage = totalPages - 1;
  if (gridPage < 0) gridPage = 0;

  const start = gridPage * GRID_PAGE_SIZE;
  const pageItems = items.slice(start, start + GRID_PAGE_SIZE);

  wrap.innerHTML = pageItems.map(item => `
    <div class="grid-card" data-sku="${item.sku}">
      <img class="grid-card-photo" src="${item.image_url || PLACEHOLDER_THUMB}" alt="${item.name}"/>
      <div class="grid-card-body">
        <div class="grid-card-name">${item.name}${item.is_special ? '<span class="special-badge">★</span>' : ''}</div>
        <div class="grid-card-meta">${item.style || '—'} · ${item.color || '—'}</div>
        <div class="grid-card-footer">
          ${statusPill(item.status)}
          <span class="qty">${typeof item.retail_price === 'number' ? '$' + item.retail_price.toFixed(2) : '—'}</span>
        </div>
      </div>
    </div>`).join('');

  pag.innerHTML = totalPages > 1 ? `
    <button class="btn btn-ghost" id="grid-prev-btn" ${gridPage === 0 ? 'disabled' : ''}>← Prev</button>
    <span class="grid-page-label">Page ${gridPage + 1} of ${totalPages}</span>
    <button class="btn btn-ghost" id="grid-next-btn" ${gridPage >= totalPages - 1 ? 'disabled' : ''}>Next →</button>
  ` : '';

  wrap.querySelectorAll('.grid-card').forEach(card => {
    card.addEventListener('click', () => openItemModal(card.dataset.sku));
  });
  const prevBtn = document.getElementById('grid-prev-btn');
  const nextBtn = document.getElementById('grid-next-btn');
  if (prevBtn) prevBtn.addEventListener('click', () => { gridPage -= 1; renderGridView(items); });
  if (nextBtn) nextBtn.addEventListener('click', () => { gridPage += 1; renderGridView(items); });
}

function renderBrowseStage(items){
  const container = document.getElementById('browse-view');
  if (!container) return;

  if (items.length === 0){
    container.innerHTML = `<div class="no-results">No items match your search.</div>`;
    return;
  }

  if (browseIndex >= items.length) browseIndex = items.length - 1;
  if (browseIndex < 0) browseIndex = 0;

  const item = items[browseIndex];
  const photo = item.image_url || PLACEHOLDER_THUMB;

  container.innerHTML = `
    <div class="browse-stage">
      <img class="browse-stage-photo" id="browse-stage-photo" src="${photo}" alt="${item.name}"/>
      <div class="browse-stage-body">
        <div class="browse-stage-name">${item.name}${item.is_special ? '<span class="special-badge">★</span>' : ''}</div>
        <div class="browse-stage-meta">${item.sku} · ${item.style || '—'} · ${item.color || '—'} · ${typeof item.retail_price === 'number' ? '$' + item.retail_price.toFixed(2) : '—'}</div>
        <div class="browse-stage-meta">${statusPill(item.status)}</div>
      </div>
      <div class="browse-nav">
        <button class="btn btn-ghost" id="browse-prev-btn" ${items.length <= 1 ? 'disabled' : ''}>← Prev</button>
        <span class="browse-counter">${browseIndex + 1} of ${items.length}</span>
        <button class="btn btn-ghost" id="browse-next-btn" ${items.length <= 1 ? 'disabled' : ''}>Next →</button>
      </div>
    </div>`;

  document.getElementById('browse-stage-photo').addEventListener('click', () => openItemModal(item.sku));
  const prevBtn = document.getElementById('browse-prev-btn');
  const nextBtn = document.getElementById('browse-next-btn');
  if (prevBtn) prevBtn.addEventListener('click', () => { browseIndex -= 1; renderBrowseStage(items); });
  if (nextBtn) nextBtn.addEventListener('click', () => { browseIndex += 1; renderBrowseStage(items); });
}

function renderActiveView(){
  const filtered = getFilteredItems();
  if (currentView === 'table'){
    document.getElementById('inv-tbody').innerHTML = renderRows(filtered, false);
  } else if (currentView === 'grid'){
    renderGridView(filtered);
  } else if (currentView === 'browse'){
    renderBrowseStage(filtered);
  }
}

function applyFilters(){
  gridPage = 0;
  browseIndex = 0;
  renderActiveView();
}

function setupViewToggle(){
  const toggle = document.getElementById('view-toggle');
  toggle.addEventListener('click', function(e){
    const btn = e.target.closest('.view-toggle-btn');
    if (!btn) return;
    currentView = btn.dataset.view;
    gridPage = 0;
    browseIndex = 0;

    document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('inv-view-table').classList.toggle('hidden', currentView !== 'table');
    document.getElementById('grid-view').classList.toggle('hidden', currentView !== 'grid');
    document.getElementById('browse-view').classList.toggle('hidden', currentView !== 'browse');

    renderActiveView();
  });
}

document.addEventListener('keydown', function(e){
  if (currentView !== 'browse') return;
  if (e.key === 'ArrowRight') document.getElementById('browse-next-btn')?.click();
  if (e.key === 'ArrowLeft') document.getElementById('browse-prev-btn')?.click();
});

function setupFilterBar(){
  const bar = document.getElementById('filter-bar');

  bar.addEventListener('click', function(e){
    const toggleKey = e.target.closest('[data-toggle]')?.dataset.toggle;
    const clearKey = e.target.closest('[data-clear]')?.dataset.clear;

    if (toggleKey){
      const panel = document.getElementById(`msel-panel-${toggleKey}`);
      const isOpen = panel.classList.contains('open');
      document.querySelectorAll('.msel-panel.open').forEach(p => p.classList.remove('open'));
      if (!isOpen) panel.classList.add('open');
      e.stopPropagation();
      return;
    }

    if (clearKey){
      FILTER_STATE[clearKey].clear();
      document.querySelectorAll(`#msel-panel-${clearKey} input[type="checkbox"]`).forEach(cb => cb.checked = false);
      updateFilterButton(clearKey);
      applyFilters();
      e.stopPropagation();
    }
  });

  bar.addEventListener('change', function(e){
    const key = e.target.dataset.filter;
    if (!key) return;
    const value = e.target.value;
    if (e.target.checked) FILTER_STATE[key].add(value);
    else FILTER_STATE[key].delete(value);
    updateFilterButton(key);
    applyFilters();
  });

  document.addEventListener('click', function(){
    document.querySelectorAll('.msel-panel.open').forEach(p => p.classList.remove('open'));
  });
}

async function init(){

      showAppShell();

  showLoginScreen();
}

init();
</script>
