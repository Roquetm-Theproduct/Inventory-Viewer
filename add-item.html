<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Product — Add Item (Admin)</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --chrome:#1b1e22; --chrome-border:rgba(255,255,255,0.08); --chrome-muted:#8b8f96;
  --paper:#f5f4f0; --card:#ffffff;
  --ink:#22262b; --ink-muted:#6b7280;
  --line:rgba(34,38,43,0.10); --line2:rgba(34,38,43,0.18);
  --brand:#a6741f; --brand-light:#c98f2a; --brand-dim:rgba(166,116,31,0.10);
  --out-stock:#a8432f; --in-stock:#2f7a55;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
.hidden{display:none !important;}

.topnav{
  display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--chrome-border);
  padding:0 20px;height:58px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:34px;width:34px;object-fit:cover;border-radius:50%;}
.brand-text{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;color:#fff;}
.admin-tag{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--brand-light);background:rgba(166,116,31,0.18);padding:3px 8px;margin-left:10px;
}
.back-link{
  margin-left:auto;color:var(--chrome-muted);font-family:'IBM Plex Mono',monospace;font-size:11px;
  text-decoration:none;letter-spacing:.5px;
}
.back-link:hover{color:#fff;}

.content{max-width:760px;margin:0 auto;padding:32px 24px 80px;}
.page-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;}
.page-sub{font-size:13px;color:var(--ink-muted);margin-top:2px;margin-bottom:28px;}

.card{background:var(--card);border:1px solid var(--line2);padding:28px;margin-bottom:20px;}
.section-label{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--brand);margin-bottom:16px;
}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{margin-bottom:16px;}
.field.full{grid-column:1 / -1;}
.field label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-muted);display:block;margin-bottom:6px;
}
.field input, .field select{
  width:100%;background:var(--paper);border:1px solid var(--line2);color:var(--ink);
  padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;
}
.field input:focus, .field select:focus{border-color:var(--brand);}
.field-hint{font-size:11px;color:var(--ink-muted);margin-top:4px;}

.photo-upload{
  border:2px dashed var(--line2);padding:20px;text-align:center;cursor:pointer;transition:border .15s;
}
.photo-upload:hover{border-color:var(--brand);}
.photo-upload input[type="file"]{display:none;}
.photo-upload-label{font-size:13px;color:var(--ink-muted);}
.photo-preview-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.photo-preview{position:relative;width:78px;height:78px;}
.photo-preview img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line2);}
.photo-preview .remove-btn{
  position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:var(--out-stock);color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer;
}
.photo-preview.main-photo img{border-color:var(--brand);border-width:2px;}
.photo-preview .main-tag{
  position:absolute;bottom:-6px;left:0;right:0;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;
  background:var(--brand);color:#fff;padding:1px 0;
}

.btn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 24px;border:none;cursor:pointer;transition:all .15s;
}
.btn-primary{background:var(--brand);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--brand-light);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink-muted);}

.status-msg{padding:12px 16px;font-size:13px;margin-bottom:20px;display:none;}
.status-msg.success{background:rgba(47,122,85,0.10);border:1px solid var(--in-stock);color:var(--in-stock);display:block;}
.status-msg.error{background:rgba(168,67,47,0.10);border:1px solid var(--out-stock);color:var(--out-stock);display:block;}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--chrome);padding:24px;}
.login-card{width:100%;max-width:360px;background:#22262b;border:1px solid var(--chrome-border);padding:36px 32px;text-align:center;}
.login-card img{width:70px;height:70px;object-fit:cover;border-radius:50%;margin:0 auto 16px;}
.login-card h1{font-family:'Big Shoulders Display',sans-serif;font-size:22px;color:#fff;}
.login-card p{font-size:12px;color:var(--chrome-muted);margin-top:6px;}
.login-field{margin:16px 0 10px;text-align:left;}
.login-field label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--chrome-muted);display:block;margin-bottom:5px;}
.login-field input{width:100%;background:#1b1e22;border:1px solid var(--chrome-border);color:#fff;padding:10px 12px;font-size:13px;outline:none;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Same project as index.html — keep these in sync */
const SUPA_URL = 'https://cwhbchoffrtmjciiywps.supabase.co';
const SUPA_KEY = 'sb_publishable_q7FXk6h1FgHR8kNTUHZFdA_B7BxaUq5';
const LOGO_SRC = 'assets/logo.png';
const PHOTO_BUCKET = 'item-photos';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const root = document.getElementById('root');

let mainPhotoFile = null;
let extraPhotoFiles = [];

function showLogin(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <h1>Admin Access</h1>
        <p>Sign in to add inventory items</p>
        <form id="login-form">
          <div class="login-field"><label>Email</label><input type="email" id="email" required/></div>
          <div class="login-field"><label>Password</label><input type="password" id="password" required/></div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Sign In</button>
        </form>
        <p id="login-err" style="color:#c9756a;margin-top:12px;"></p>
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) document.getElementById('login-err').textContent = error.message;
    else showForm();
  });
}

function fileToPreview(file, container, isMain){
  const reader = new FileReader();
  reader.onload = (e) => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-preview' + (isMain ? ' main-photo' : '');
    wrap.innerHTML = `<img src="${e.target.result}"/>${isMain ? '<div class="main-tag">Main</div>' : ''}<button type="button" class="remove-btn">×</button>`;
    wrap.querySelector('.remove-btn').addEventListener('click', () => {
      if (isMain){ mainPhotoFile = null; } else { extraPhotoFiles = extraPhotoFiles.filter(f => f !== file); }
      wrap.remove();
    });
    container.appendChild(wrap);
  };
  reader.readAsDataURL(file);
}

function showForm(){
  mainPhotoFile = null;
  extraPhotoFiles = [];

  root.innerHTML = `
    <div class="topnav">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <span class="brand-text">The Product</span>
        <span class="admin-tag">Admin</span>
      </div>
      <a href="index.html" class="back-link">← Back to Inventory</a>
    </div>
    <div class="content">
      <div class="page-title">Add Item</div>
      <div class="page-sub">Add a new item to inventory, including photos and all filterable details.</div>

      <div id="status-msg" class="status-msg"></div>

      <form id="item-form">
        <div class="card">
          <div class="section-label">Basic Info</div>
          <div class="field-grid">
            <div class="field"><label>SKU *</label><input type="text" id="f-sku" required/></div>
            <div class="field"><label>Description *</label><input type="text" id="f-name" required/></div>
            <div class="field"><label>Style</label><input type="text" id="f-style" placeholder="e.g. Modern"/></div>
            <div class="field"><label>Color</label><input type="text" id="f-color" placeholder="e.g. Gray"/></div>
            <div class="field"><label>Finish</label><input type="text" id="f-finish" placeholder="e.g. Polished"/></div>
            <div class="field"><label>Retail Price ($)</label><input type="number" step="0.01" id="f-price" placeholder="0.00"/></div>
          </div>
        </div>

        <div class="card">
          <div class="section-label">Stock Info</div>
          <div class="field-grid">
            <div class="field"><label>Quantity *</label><input type="number" id="f-qty" required value="0"/></div>
            <div class="field">
              <label>Availability *</label>
              <select id="f-status" required>
                <option value="available">Available</option>
                <option value="on_hold">On Hold</option>
                <option value="sold">Sold</option>
              </select>
            </div>
            <div class="field hidden" id="held-by-field"><label>Held By</label><input type="text" id="f-held-by" placeholder="Employee name"/></div>
            <div class="field hidden" id="order-type-field">
              <label>Order Type</label>
              <select id="f-order-type">
                <option value="sales_order">Sales Order</option>
                <option value="transfer_order">Transfer Order</option>
              </select>
            </div>
            <div class="field hidden" id="order-number-field"><label>Order Number</label><input type="text" id="f-order-number" placeholder="e.g. SO-10493"/></div>
            <div class="field"><label>Location</label><input type="text" id="f-location" placeholder="e.g. Yard A / Bay 3"/></div>
            <div class="field"><label>Bin #</label><input type="text" id="f-bin" placeholder="e.g. A-03"/></div>
          </div>
        </div>

        <div class="card">
          <div class="section-label">Core Hole &amp; Pairing</div>
          <div class="field-grid">
            <div class="field">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" id="f-core-hole"/> Has Core Hole (for cremains)
              </label>
            </div>
            <div class="field hidden" id="core-hole-qty-field"><label>Core Hole Qty</label><input type="number" id="f-core-hole-qty" min="0"/></div>
            <div class="field full"><label>Paired With (SKU)</label><input type="text" id="f-paired-sku" placeholder="SKU of the base or tablet this pairs with"/></div>
          </div>
        </div>

        <div class="card">
          <div class="section-label">Main Photo (shown as the thumbnail)</div>
          <div class="photo-upload" id="main-upload-zone">
            <input type="file" id="f-main-photo" accept="image/*"/>
            <div class="photo-upload-label">Click to choose a main photo</div>
          </div>
          <div class="photo-preview-grid" id="main-preview"></div>
        </div>

        <div class="card">
          <div class="section-label">Additional Photos (optional)</div>
          <div class="photo-upload" id="extra-upload-zone">
            <input type="file" id="f-extra-photos" accept="image/*" multiple/>
            <div class="photo-upload-label">Click to choose one or more additional photos</div>
          </div>
          <div class="photo-preview-grid" id="extra-preview"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Save Item</button>
      </form>
    </div>`;

  const mainZone = document.getElementById('main-upload-zone');
  const mainInput = document.getElementById('f-main-photo');
  const mainPreview = document.getElementById('main-preview');
  mainZone.addEventListener('click', () => mainInput.click());
  mainInput.addEventListener('change', () => {
    if (mainInput.files[0]){
      mainPhotoFile = mainInput.files[0];
      mainPreview.innerHTML = '';
      fileToPreview(mainPhotoFile, mainPreview, true);
    }
  });

  const extraZone = document.getElementById('extra-upload-zone');
  const extraInput = document.getElementById('f-extra-photos');
  const extraPreview = document.getElementById('extra-preview');
  extraZone.addEventListener('click', () => extraInput.click());
  extraInput.addEventListener('change', () => {
    Array.from(extraInput.files).forEach(file => {
      extraPhotoFiles.push(file);
      fileToPreview(file, extraPreview, false);
    });
    extraInput.value = '';
  });

  document.getElementById('item-form').addEventListener('submit', handleSubmit);

  document.getElementById('f-core-hole').addEventListener('change', function(){
    document.getElementById('core-hole-qty-field').classList.toggle('hidden', !this.checked);
  });

  const statusSelect = document.getElementById('f-status');
  statusSelect.addEventListener('change', function(){
    document.getElementById('held-by-field').classList.toggle('hidden', statusSelect.value !== 'on_hold');
    document.getElementById('order-type-field').classList.toggle('hidden', statusSelect.value !== 'sold');
    document.getElementById('order-number-field').classList.toggle('hidden', statusSelect.value !== 'sold');
  });
}

async function uploadPhoto(file, sku, tag){
  const ext = file.name.split('.').pop();
  const path = `${sku}/${tag}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, file);
  if (error) throw error;
  const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function handleSubmit(e){
  e.preventDefault();
  const statusMsg = document.getElementById('status-msg');
  const submitBtn = document.getElementById('submit-btn');
  statusMsg.className = 'status-msg';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try{
    const sku = document.getElementById('f-sku').value.trim();
    if (!sku) throw new Error('SKU is required.');

    let imageUrl = '';
    if (mainPhotoFile){
      submitBtn.textContent = 'Uploading main photo…';
      imageUrl = await uploadPhoto(mainPhotoFile, sku, 'main');
    }

    const photoUrls = [];
    for (let i = 0; i < extraPhotoFiles.length; i++){
      submitBtn.textContent = `Uploading photo ${i + 1} of ${extraPhotoFiles.length}…`;
      const url = await uploadPhoto(extraPhotoFiles[i], sku, `extra-${i}`);
      photoUrls.push(url);
    }

    submitBtn.textContent = 'Saving item…';
    const { error } = await sb.from('inventory').insert({
      sku,
      name: document.getElementById('f-name').value.trim(),
      style: document.getElementById('f-style').value.trim() || null,
      color: document.getElementById('f-color').value.trim() || null,
      finish: document.getElementById('f-finish').value.trim() || null,
      retail_price: document.getElementById('f-price').value ? parseFloat(document.getElementById('f-price').value) : null,
      qty: parseInt(document.getElementById('f-qty').value, 10) || 0,
      status: document.getElementById('f-status').value,
      location: document.getElementById('f-location').value.trim() || null,
      bin_number: document.getElementById('f-bin').value.trim() || null,
      held_by: document.getElementById('f-status').value === 'on_hold' ? (document.getElementById('f-held-by').value.trim() || null) : null,
      order_type: document.getElementById('f-status').value === 'sold' ? document.getElementById('f-order-type').value : null,
      order_number: document.getElementById('f-status').value === 'sold' ? (document.getElementById('f-order-number').value.trim() || null) : null,
      has_core_hole: document.getElementById('f-core-hole').checked,
      core_hole_qty: document.getElementById('f-core-hole').checked && document.getElementById('f-core-hole-qty').value
        ? parseInt(document.getElementById('f-core-hole-qty').value, 10) : null,
      paired_sku: document.getElementById('f-paired-sku').value.trim() || null,
      image_url: imageUrl || null,
      photo_urls: photoUrls
    });

    if (error) throw error;

    statusMsg.className = 'status-msg success';
    statusMsg.textContent = `"${sku}" was added successfully.`;
    document.getElementById('item-form').reset();
    document.getElementById('main-preview').innerHTML = '';
    document.getElementById('extra-preview').innerHTML = '';
    mainPhotoFile = null;
    extraPhotoFiles = [];
    window.scrollTo(0, 0);

  } catch (err){
    statusMsg.className = 'status-msg error';
    statusMsg.textContent = err.message || 'Something went wrong saving this item.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Item';
  }
}

async function init(){
  const { data } = await sb.auth.getSession();
  if (data.session) showForm();
  else showLogin();
}
init();
</script>
</body>
</html>
