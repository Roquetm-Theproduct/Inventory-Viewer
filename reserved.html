<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Product — Reserved Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --chrome:#1b1e22; --chrome-border:rgba(255,255,255,0.08); --chrome-muted:#8b8f96;
  --paper:#f5f4f0; --card:#ffffff;
  --ink:#22262b; --ink-muted:#6b7280;
  --line:rgba(34,38,43,0.10); --line2:rgba(34,38,43,0.18);
  --brand:#a6741f; --brand-light:#c98f2a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}

.topnav{display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--chrome-border);padding:0 20px;height:58px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:34px;width:34px;object-fit:cover;border-radius:50%;}
.brand-text{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;color:#fff;}
.nav-links{margin-left:24px;display:flex;gap:4px;}
.nav-link{color:var(--chrome-muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;letter-spacing:.5px;padding:8px 12px;}
.nav-link:hover{color:#fff;}
.right-actions{margin-left:auto;display:flex;align-items:center;gap:14px;}

.content{max-width:1000px;margin:0 auto;padding:28px 24px 80px;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;}
.page-sub{font-size:13px;color:var(--ink-muted);margin-top:2px;}

.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 20px;border:none;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--brand);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--brand-light);}

.table-card{background:var(--card);border:1px solid var(--line2);}
table{width:100%;border-collapse:collapse;}
thead th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--paper);}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;}
tbody tr:last-child td{border-bottom:none;}
.sku{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted);}
.qty{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.no-results{padding:32px 16px;text-align:center;color:var(--ink-muted);font-size:13px;}

.print-header{display:none;}
.print-total{text-align:right;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;border-top:1px solid var(--line2);}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--chrome);padding:24px;}
.login-card{width:100%;max-width:360px;background:#22262b;border:1px solid var(--chrome-border);padding:36px 32px;text-align:center;}
.login-card img{width:70px;height:70px;object-fit:cover;border-radius:50%;margin:0 auto 16px;}
.login-card h1{font-family:'Big Shoulders Display',sans-serif;font-size:22px;color:#fff;}
.login-field{margin:16px 0 10px;text-align:left;}
.login-field label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--chrome-muted);display:block;margin-bottom:5px;}
.login-field input{width:100%;background:#1b1e22;border:1px solid var(--chrome-border);color:#fff;padding:10px 12px;font-size:13px;outline:none;}

@media print{
  .topnav, .btn, .nav-links{display:none !important;}
  body{background:#fff;}
  .content{max-width:100%;padding:0;}
  .print-header{display:block;margin-bottom:20px;}
  .print-header h1{font-family:'Big Shoulders Display',sans-serif;font-size:24px;}
  .print-header p{font-size:12px;color:#555;margin-top:2px;}
  .table-card{border:none;}
  thead th{background:#fff;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://cwhbchoffrtmjciiywps.supabase.co';
const SUPA_KEY = 'sb_publishable_q7FXk6h1FgHR8kNTUHZFdA_B7BxaUq5';
const LOGO_SRC = 'assets/logo.png';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const root = document.getElementById('root');

function showLogin(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <h1>Sign In</h1>
        <form id="login-form">
          <div class="login-field"><label>Email</label><input type="email" id="email" required/></div>
          <div class="login-field"><label>Password</label><input type="password" id="password" required/></div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Sign In</button>
        </form>
        <p id="login-err" style="color:#c9756a;margin-top:12px;"></p>
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) document.getElementById('login-err').textContent = error.message;
    else showSheet();
  });
}

async function showSheet(){
  const { data, error } = await sb.from('inventory')
    .select('*')
    .eq('status', 'reserved')
    .eq('is_archived', false)
    .order('location');

  const items = (!error && data) ? data : [];
  const total = items.reduce((sum, i) => sum + (typeof i.retail_price === 'number' ? i.retail_price : 0), 0);
  const today = new Date().toLocaleDateString();

  const rows = items.length === 0
    ? `<tr><td colspan="7" class="no-results">Nothing is currently reserved.</td></tr>`
    : items.map(item => `
        <tr>
          <td class="sku">${item.sku}</td>
          <td>${item.name}</td>
          <td>${item.location || '—'}</td>
          <td>${item.bin_number || '—'}</td>
          <td>${item.held_by || '—'}</td>
          <td>${item.reserved_at ? new Date(item.reserved_at).toLocaleDateString() : '—'}</td>
          <td class="qty">${typeof item.retail_price === 'number' ? '$' + item.retail_price.toFixed(2) : '—'}</td>
        </tr>`).join('');

  root.innerHTML = `
    <div class="topnav">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <span class="brand-text">The Product</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Inventory</a>
      </div>
      <div class="right-actions">
        <button class="btn btn-primary" id="print-btn">Print</button>
      </div>
    </div>
    <div class="content">
      <div class="print-header">
        <h1>The Product — Reserved Items</h1>
        <p>Printed ${today}</p>
      </div>
      <div class="page-header">
        <div>
          <div class="page-title">Reserved Sheet</div>
          <div class="page-sub">Everything currently reserved, with retail pricing.</div>
        </div>
      </div>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>SKU</th><th>Description</th><th>Location</th><th>Bin #</th>
              <th>Reserved By</th><th>Date</th><th>Retail Price</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        ${items.length > 0 ? `<div class="print-total">Total Reserved Value: $${total.toFixed(2)}</div>` : ''}
      </div>
    </div>`;

  document.getElementById('print-btn').addEventListener('click', () => window.print());
}

async function init(){
  const { data } = await sb.auth.getSession();
  if (data.session) showSheet();
  else showLogin();
}
init();
</script>
</body>
</html>
