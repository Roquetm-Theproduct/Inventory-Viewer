<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Product — Master List (Admin)</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --chrome:#1b1e22; --chrome-border:rgba(255,255,255,0.08); --chrome-muted:#8b8f96;
  --paper:#f5f4f0; --card:#ffffff;
  --ink:#22262b; --ink-muted:#6b7280;
  --line:rgba(34,38,43,0.10); --line2:rgba(34,38,43,0.18);
  --brand:#a6741f; --brand-light:#c98f2a; --brand-dim:rgba(166,116,31,0.10);
  --in-stock:#2f7a55; --in-stock-dim:rgba(47,122,85,0.12);
  --low-stock:#c17f2a; --low-stock-dim:rgba(193,127,42,0.12);
  --out-stock:#a8432f; --out-stock-dim:rgba(168,67,47,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
.hidden{display:none !important;}

.topnav{display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--chrome-border);padding:0 20px;height:58px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:34px;width:34px;object-fit:cover;border-radius:50%;}
.brand-text{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;color:#fff;}
.admin-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brand-light);background:rgba(166,116,31,0.18);padding:3px 8px;margin-left:10px;}
.nav-links{margin-left:24px;display:flex;gap:4px;}
.nav-link{color:var(--chrome-muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;letter-spacing:.5px;padding:8px 12px;}
.nav-link:hover{color:#fff;}
.right-actions{margin-left:auto;display:flex;align-items:center;gap:14px;}

.content{max-width:1280px;margin:0 auto;padding:28px 24px 80px;}
.page-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;}
.page-sub{font-size:13px;color:var(--ink-muted);margin-top:2px;margin-bottom:22px;}

.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-input{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line2);color:var(--ink);padding:9px 12px;font-size:13px;outline:none;}
.search-input:focus{border-color:var(--brand);}
.filter-select{background:var(--card);border:1px solid var(--line2);color:var(--ink);padding:9px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.checkbox-filter{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line2);padding:9px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.checkbox-filter input{cursor:pointer;accent-color:var(--brand);}
.checkbox-filter.active{border-color:var(--brand);color:var(--brand);}

.table-card{background:var(--card);border:1px solid var(--line2);overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--paper);white-space:nowrap;}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:rgba(34,38,43,0.02);}
.sku{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted);}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:3px;border:1px solid var(--line2);}
.no-results{padding:32px 16px;text-align:center;color:var(--ink-muted);font-size:13px;}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-pill.in{background:var(--in-stock-dim);color:var(--in-stock);}
.status-pill.in .dot{background:var(--in-stock);}
.status-pill.low{background:var(--low-stock-dim);color:var(--low-stock);}
.status-pill.low .dot{background:var(--low-stock);}
.status-pill.out{background:var(--out-stock-dim);color:var(--out-stock);}
.status-pill.out .dot{background:var(--out-stock);}
.archived-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);background:var(--line);padding:2px 7px;margin-left:6px;}

.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 20px;border:none;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--brand);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--brand-light);}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink-muted);}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,17,13,0.62);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-card{background:var(--card);max-width:720px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--line2);}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--card);z-index:2;}
.modal-header-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;}
.modal-header-sku{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-muted);}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-muted);line-height:1;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:24px;}
.gallery-main{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line2);background:var(--paper);}
.gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.gallery-thumb{width:56px;height:56px;object-fit:cover;border:2px solid transparent;cursor:pointer;border-radius:3px;}
.gallery-thumb.active{border-color:var(--brand);}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brand);margin:20px 0 12px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-field{margin-bottom:14px;}
.modal-field label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:6px;}
.modal-field input, .modal-field select{width:100%;background:var(--paper);border:1px solid var(--line2);color:var(--ink);padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
.modal-actions{display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap;}
.modal-note{font-size:12px;color:var(--ink-muted);margin-top:14px;}
.paired-link{color:var(--brand);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:13px;font-family:'Inter',sans-serif;padding:0;}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--chrome);padding:24px;}
.login-card{width:100%;max-width:360px;background:#22262b;border:1px solid var(--chrome-border);padding:36px 32px;text-align:center;}
.login-card img{width:70px;height:70px;object-fit:cover;border-radius:50%;margin:0 auto 16px;}
.login-card h1{font-family:'Big Shoulders Display',sans-serif;font-size:22px;color:#fff;}
.login-card p{font-size:12px;color:var(--chrome-muted);margin-top:6px;}
.login-field{margin:16px 0 10px;text-align:left;}
.login-field label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--chrome-muted);display:block;margin-bottom:5px;}
.login-field input{width:100%;background:#1b1e22;border:1px solid var(--chrome-border);color:#fff;padding:10px 12px;font-size:13px;outline:none;}

.denied-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:24px;text-align:center;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Same project as index.html — keep these in sync */
const SUPA_URL = 'https://cwhbchoffrtmjciiywps.supabase.co';
const SUPA_KEY = 'sb_publishable_q7FXk6h1FgHR8kNTUHZFdA_B7BxaUq5';
const LOGO_SRC = 'assets/logo.png';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const root = document.getElementById('root');

const PLACEHOLDER_THUMB = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
    <rect width="44" height="44" fill="#e4e1d9"/>
    <path d="M10 30 L18 16 L26 24 L30 18 L34 30 Z" fill="#a89985"/>
    <circle cx="16" cy="14" r="3" fill="#a89985"/>
  </svg>`);

let allItems = [];
let includeArchived = false;
const STORE_OPTIONS = ['Michelich', 'Watertown', 'Worthington', 'Norfolk'];

function statusPill(status){
  const labels = { available:'Available', reserved:'Reserved', sold:'Sold' };
  const classes = { available:'in', reserved:'low', sold:'out' };
  return `<span class="status-pill ${classes[status] || 'in'}"><span class="dot"></span>${labels[status] || status}</span>`;
}

function showLogin(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <h1>Admin Access</h1>
        <p>Sign in to manage inventory records</p>
        <form id="login-form">
          <div class="login-field"><label>Email</label><input type="email" id="email" required/></div>
          <div class="login-field"><label>Password</label><input type="password" id="password" required/></div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Sign In</button>
        </form>
        <p id="login-err" style="color:#c9756a;margin-top:12px;"></p>
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) document.getElementById('login-err').textContent = error.message;
    else init();
  });
}

function showDenied(){
  root.innerHTML = `
    <div class="denied-screen">
      <div>
        <div class="page-title">Admins Only</div>
        <p class="page-sub">This page is for inventory admins. If that should be you, ask another admin to update your role.</p>
        <a href="index.html" class="nav-link" style="color:var(--brand);">← Back to Inventory</a>
      </div>
    </div>`;
}

async function loadItems(){
  let query = sb.from('inventory').select('*').order('sku');
  if (!includeArchived) query = query.eq('is_archived', false);
  const { data, error } = await query;
  allItems = (!error && data) ? data : [];
}

function renderTableRows(items){
  if (items.length === 0) return `<tr><td colspan="9" class="no-results">No items found.</td></tr>`;
  return items.map(item => `
    <tr data-sku="${item.sku}">
      <td><img class="thumb" src="${item.image_url || PLACEHOLDER_THUMB}"/></td>
      <td class="sku">${item.sku}</td>
      <td>${item.name}</td>
      <td>${item.style || '—'}</td>
      <td>${item.qty}</td>
      <td>${item.location || '—'}</td>
      <td>${typeof item.retail_price === 'number' ? '$' + item.retail_price.toFixed(2) : '—'}</td>
      <td>${statusPill(item.status)}</td>
      <td>
        ${item.is_archived ? '<span class="archived-badge">Archived</span>' : ''}
        ${item.needs_review ? '<span class="archived-badge" style="color:var(--out-stock);background:rgba(168,67,47,0.12);">Needs Review</span>' : ''}
      </td>
    </tr>`).join('');
}

function applyListFilters(){
  const q = document.getElementById('list-search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('list-status-filter').value;
  const coreHoleOnly = document.getElementById('list-core-hole-filter').checked;
  const reviewOnly = document.getElementById('list-review-filter').checked;

  const filtered = allItems.filter(item => {
    const matchesQuery = !q || item.sku.toLowerCase().includes(q) || item.name.toLowerCase().includes(q);
    const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
    const matchesCoreHole = !coreHoleOnly || item.has_core_hole === true;
    const matchesReview = !reviewOnly || item.needs_review === true;
    return matchesQuery && matchesStatus && matchesCoreHole && matchesReview;
  });

  document.getElementById('list-tbody').innerHTML = renderTableRows(filtered);
}

async function showList(){
  await loadItems();

  root.innerHTML = `
    <div class="topnav">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <span class="brand-text">The Product</span>
        <span class="admin-tag">Admin</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Inventory</a>
        <a href="add-item.html" class="nav-link">+ Add Item</a>
        <a href="manage-users.html" class="nav-link">Users</a>
        <a href="data-center.html" class="nav-link">Data Center</a>
      </div>
      <div class="right-actions">
        <button class="btn btn-ghost" id="sign-out-btn">Sign Out</button>
      </div>
    </div>
    <div class="content">
      <div class="page-title">Master List</div>
      <div class="page-sub">Full item records. Edit status, hold/order info, core hole, and pairing here — not sales-facing.</div>

      <div class="toolbar">
        <input type="text" id="list-search" class="search-input" placeholder="Search by SKU or description…"/>
        <select id="list-status-filter" class="filter-select">
          <option value="all">All Statuses</option>
          <option value="available">Available</option>
          <option value="reserved">Reserved</option>
          <option value="sold">Sold</option>
        </select>
        <label class="checkbox-filter" id="core-hole-filter-label">
          <input type="checkbox" id="list-core-hole-filter"/> Core Hole
        </label>
        <label class="checkbox-filter" id="review-filter-label">
          <input type="checkbox" id="list-review-filter"/> Needs Review
        </label>
        <label class="checkbox-filter" id="archived-toggle-label">
          <input type="checkbox" id="list-include-archived" ${includeArchived ? 'checked' : ''}/> Include Archived
        </label>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th></th><th>SKU</th><th>Description</th><th>Style</th><th>QTY</th>
              <th>Location</th><th>Retail Price</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="list-tbody">${renderTableRows(allItems)}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('sign-out-btn').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });
  document.getElementById('list-search').addEventListener('input', applyListFilters);
  document.getElementById('list-status-filter').addEventListener('change', applyListFilters);
  document.getElementById('list-core-hole-filter').addEventListener('change', function(){
    document.getElementById('core-hole-filter-label').classList.toggle('active', this.checked);
    applyListFilters();
  });
  document.getElementById('list-review-filter').addEventListener('change', function(){
    document.getElementById('review-filter-label').classList.toggle('active', this.checked);
    applyListFilters();
  });
  document.getElementById('list-include-archived').addEventListener('change', async function(){
    document.getElementById('archived-toggle-label').classList.toggle('active', this.checked);
    includeArchived = this.checked;
    await loadItems();
    applyListFilters();
  });
  document.getElementById('list-tbody').addEventListener('click', function(e){
    const row = e.target.closest('tr[data-sku]');
    if (!row) return;
    openEditModal(row.dataset.sku);
  });
}

/* ---------- Edit modal (this page only — full editing) ---------- */
function ensureModalRoot(){
  let overlay = document.getElementById('modal-overlay');
  if (!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  }
  return overlay;
}

async function findItem(sku){
  const local = allItems.find(i => i.sku === sku);
  if (local) return local;
  const { data, error } = await sb.from('inventory').select('*').eq('sku', sku).single();
  return (!error && data) ? data : null;
}

function pairedWithHtml(item){
  if (!item.paired_sku) return '';
  return `<button class="paired-link" data-open-sku="${item.paired_sku}">View paired item: ${item.paired_sku} →</button>`;
}

async function openEditModal(sku){
  const item = await findItem(sku);
  if (!item){ alert('Item not found.'); return; }

  const pairedItem = item.paired_sku ? await findItem(item.paired_sku) : null;
  const sameLocationPair = pairedItem && pairedItem.location && item.location && pairedItem.location === item.location;

  const overlay = ensureModalRoot();
  const photos = [item.image_url, ...(item.photo_urls || [])].filter(Boolean);
  const displayPhotos = photos.length ? photos : [PLACEHOLDER_THUMB];
  const thumbsHtml = displayPhotos.map((url, i) => `<img src="${url}" class="gallery-thumb ${i === 0 ? 'active' : ''}" data-index="${i}"/>`).join('');
  const statusOptionsHtml = ['available','reserved','sold'].map(s =>
    `<option value="${s}" ${item.status === s ? 'selected' : ''}>${s === 'reserved' ? 'Reserved' : s.charAt(0).toUpperCase() + s.slice(1)}</option>`
  ).join('');

  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-header-title">${item.name}</div>
          <div class="modal-header-sku">${item.sku}</div>
        </div>
        <button class="modal-close" id="modal-close-btn">×</button>
      </div>
      <div class="modal-body">
        <img id="modal-gallery-main" class="gallery-main" src="${displayPhotos[0]}"/>
        ${displayPhotos.length > 1 ? `<div class="gallery-thumbs" id="modal-gallery-thumbs">${thumbsHtml}</div>` : ''}
        ${pairedWithHtml(item) ? `<div class="modal-note" id="modal-paired-with">${pairedWithHtml(item)}</div>` : ''}

        <div class="section-label">Availability</div>
        <div class="field-grid">
          <div class="modal-field">
            <label>Status</label>
            <select id="modal-status-select">${statusOptionsHtml}</select>
          </div>
          <div class="modal-field">
            <label>Quantity</label>
            <input type="number" id="modal-qty" value="${item.qty}"/>
          </div>
        </div>
        <div class="modal-field ${item.status === 'reserved' || item.status === 'sold' ? '' : 'hidden'}" id="modal-held-field">
          <label>Store</label>
          <select id="modal-held-by">
            <option value="">Select a store…</option>
            ${STORE_OPTIONS.map(s => `<option value="${s}" ${item.held_by === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
          ${item.status === 'reserved' && item.reserved_at ? `<div class="modal-note" style="margin-top:6px;">Reserved on ${new Date(item.reserved_at).toLocaleDateString()} — set automatically, not editable</div>` : ''}
        </div>
        <div class="modal-field ${item.status === 'reserved' && sameLocationPair ? '' : 'hidden'}" id="modal-also-reserve-field">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="modal-also-reserve-paired"/> Also reserve ${pairedItem ? pairedItem.name + ' (' + pairedItem.sku + ')' : 'paired item'} — same location
          </label>
        </div>
        <div class="field-grid ${item.status === 'sold' ? '' : 'hidden'}" id="modal-order-fields">
          <div class="modal-field">
            <label>Order Type</label>
            <select id="modal-order-type">
              <option value="sales_order" ${item.order_type === 'sales_order' ? 'selected' : ''}>Sales Order</option>
              <option value="transfer_order" ${item.order_type === 'transfer_order' ? 'selected' : ''}>Transfer Order</option>
            </select>
          </div>
          <div class="modal-field">
            <label>Order Number</label>
            <input type="text" id="modal-order-number" value="${item.order_number || ''}" placeholder="e.g. SO-10493"/>
          </div>
        </div>

        <div class="section-label">Item Details</div>
        <div class="field-grid">
          <div class="modal-field"><label>Description</label><input type="text" id="modal-name" value="${item.name || ''}"/></div>
          <div class="modal-field"><label>Style</label><input type="text" id="modal-style" value="${item.style || ''}"/></div>
          <div class="modal-field"><label>Color</label><input type="text" id="modal-color" value="${item.color || ''}"/></div>
          <div class="modal-field"><label>Finish</label><input type="text" id="modal-finish" value="${item.finish || ''}"/></div>
          <div class="modal-field"><label>Retail Price ($)</label><input type="number" step="0.01" id="modal-price" value="${item.retail_price ?? ''}"/></div>
          <div class="modal-field"><label>Location</label><input type="text" id="modal-location" value="${item.location || ''}"/></div>
          <div class="modal-field"><label>Bin #</label><input type="text" id="modal-bin" value="${item.bin_number || ''}"/></div>
        </div>

        <div class="section-label">Core Hole &amp; Pairing</div>
        <div class="modal-field">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="modal-core-hole" ${item.has_core_hole ? 'checked' : ''}/> Has Core Hole (for cremains)
          </label>
        </div>
        <div class="modal-field ${item.has_core_hole ? '' : 'hidden'}" id="modal-core-hole-qty-field">
          <label>Core Hole Qty</label>
          <input type="number" id="modal-core-hole-qty" min="0" value="${item.core_hole_qty || ''}"/>
        </div>
        <div class="modal-field">
          <label>Paired With (SKU)</label>
          <input type="text" id="modal-paired-sku" value="${item.paired_sku || ''}" placeholder="e.g. the base's SKU"/>
        </div>

        <div class="section-label">NetSuite Sync</div>
        <div class="field-grid">
          <div class="modal-field"><label>NetSuite ID</label><div style="font-size:13px;padding:9px 0;color:var(--ink-muted);">${item.netsuite_id || '— not synced yet —'}</div></div>
          <div class="modal-field"><label>NetSuite Location ID</label><div style="font-size:13px;padding:9px 0;color:var(--ink-muted);">${item.netsuite_location_id || '— not synced yet —'}</div></div>
        </div>

        ${item.needs_review ? `
        <div class="modal-field" style="background:rgba(168,67,47,0.08);border:1px solid var(--out-stock);padding:14px;">
          <label style="color:var(--out-stock);">Needs Review</label>
          <div style="font-size:13px;">${item.review_reason || 'Flagged for review.'}</div>
          ${item.review_flagged_at ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:4px;">Flagged on ${new Date(item.review_flagged_at).toLocaleDateString()}</div>` : ''}
          <button type="button" class="btn btn-ghost" id="modal-clear-review-btn" style="margin-top:10px;">Clear Review Flag</button>
        </div>` : ''}

        <div class="modal-actions">
          <button class="btn btn-primary" id="modal-save-btn">Save Changes</button>
          ${item.status === 'sold' && !item.is_archived ? `<button class="btn btn-ghost" id="modal-archive-btn">Archive Item</button>` : ''}
          ${item.is_archived ? `<button class="btn btn-ghost" id="modal-restore-btn">Restore from Archive</button>` : ''}
        </div>
        <div id="modal-status-msg" class="modal-note"></div>
      </div>
    </div>`;

  overlay.classList.add('open');
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);

  if (displayPhotos.length > 1){
    document.getElementById('modal-gallery-thumbs').addEventListener('click', function(e){
      const thumb = e.target.closest('.gallery-thumb');
      if (!thumb) return;
      const i = parseInt(thumb.dataset.index, 10);
      document.getElementById('modal-gallery-main').src = displayPhotos[i];
      overlay.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    });
  }

  const pairedEl = document.getElementById('modal-paired-with');
  if (pairedEl){
    pairedEl.addEventListener('click', function(e){
      const link = e.target.closest('[data-open-sku]');
      if (!link) return;
      openEditModal(link.dataset.openSku);
    });
  }

  const statusSelect = document.getElementById('modal-status-select');
  statusSelect.addEventListener('change', function(){
    document.getElementById('modal-held-field').classList.toggle('hidden', statusSelect.value !== 'reserved' && statusSelect.value !== 'sold');
    document.getElementById('modal-order-fields').classList.toggle('hidden', statusSelect.value !== 'sold');
    const alsoReserveField = document.getElementById('modal-also-reserve-field');
    if (alsoReserveField && sameLocationPair){
      alsoReserveField.classList.toggle('hidden', statusSelect.value !== 'reserved');
    }
  });

  const coreHoleCheckbox = document.getElementById('modal-core-hole');
  coreHoleCheckbox.addEventListener('change', function(){
    document.getElementById('modal-core-hole-qty-field').classList.toggle('hidden', !coreHoleCheckbox.checked);
  });

  document.getElementById('modal-save-btn').addEventListener('click', () => saveItem(item.sku));

  const archiveBtn = document.getElementById('modal-archive-btn');
  if (archiveBtn) archiveBtn.addEventListener('click', () => archiveItem(item.sku));

  const restoreBtn = document.getElementById('modal-restore-btn');
  if (restoreBtn) restoreBtn.addEventListener('click', () => restoreItem(item.sku));

  const clearReviewBtn = document.getElementById('modal-clear-review-btn');
  if (clearReviewBtn) clearReviewBtn.addEventListener('click', () => clearReviewFlag(item.sku));
}

function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.classList.remove('open');
}

async function saveItem(sku){
  const msg = document.getElementById('modal-status-msg');
  const status = document.getElementById('modal-status-select').value;
  const hasCoreHole = document.getElementById('modal-core-hole').checked;

  const updates = {
    status,
    qty: parseInt(document.getElementById('modal-qty').value, 10) || 0,
    held_by: (status === 'reserved' || status === 'sold') ? (document.getElementById('modal-held-by').value || null) : null,
    order_type: status === 'sold' ? document.getElementById('modal-order-type').value : null,
    order_number: status === 'sold' ? (document.getElementById('modal-order-number').value.trim() || null) : null,
    name: document.getElementById('modal-name').value.trim(),
    style: document.getElementById('modal-style').value.trim() || null,
    color: document.getElementById('modal-color').value.trim() || null,
    finish: document.getElementById('modal-finish').value.trim() || null,
    retail_price: document.getElementById('modal-price').value ? parseFloat(document.getElementById('modal-price').value) : null,
    location: document.getElementById('modal-location').value.trim() || null,
    bin_number: document.getElementById('modal-bin').value.trim() || null,
    has_core_hole: hasCoreHole,
    core_hole_qty: hasCoreHole && document.getElementById('modal-core-hole-qty').value
      ? parseInt(document.getElementById('modal-core-hole-qty').value, 10) : null,
    paired_sku: document.getElementById('modal-paired-sku').value.trim() || null,
  };

  const { error } = await sb.from('inventory').update(updates).eq('sku', sku);
  if (error){
    msg.textContent = 'Could not save: ' + error.message;
    msg.style.color = '#a8432f';
    return;
  }

  const alsoReserveCheckbox = document.getElementById('modal-also-reserve-paired');
  if (alsoReserveCheckbox && alsoReserveCheckbox.checked && !alsoReserveCheckbox.closest('.hidden')){
    const pairedSku = document.getElementById('modal-paired-sku').value.trim();
    if (pairedSku){
      const { error: pairedError } = await sb.from('inventory').update({
        status: 'reserved',
        held_by: updates.held_by
      }).eq('sku', pairedSku);
      if (pairedError){
        alert(`Saved "${sku}", but could not also reserve the paired item: ${pairedError.message}`);
      }
    }
  }

  closeModal();
  showList();
}

async function archiveItem(sku){
  if (!confirm(`Archive ${sku}?`)) return;
  const { error } = await sb.from('inventory').update({ is_archived: true }).eq('sku', sku);
  if (error){ alert('Could not archive: ' + error.message); return; }
  closeModal();
  showList();
}

async function clearReviewFlag(sku){
  if (!confirm(`Clear the review flag for ${sku}? Only do this once you've confirmed what actually happened with this item.`)) return;
  const { error } = await sb.from('inventory').update({
    needs_review: false, review_reason: null, review_flagged_at: null
  }).eq('sku', sku);
  if (error){ alert('Could not clear the flag: ' + error.message); return; }
  closeModal();
  showList();
}

async function restoreItem(sku){
  const { error } = await sb.from('inventory').update({ is_archived: false }).eq('sku', sku);
  if (error){ alert('Could not restore: ' + error.message); return; }
  closeModal();
  showList();
}

async function init(){
  const { data: sessionData } = await sb.auth.getSession();
  if (!sessionData.session){ showLogin(); return; }

  const { data: profile, error } = await sb.from('profiles').select('role').eq('id', sessionData.session.user.id).single();
  if (error || !profile || profile.role !== 'admin'){ showDenied(); return; }

  showList();
}

init();
</script>
</body>
</html>
