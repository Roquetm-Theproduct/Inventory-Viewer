<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Product — Manage Users (Admin)</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --chrome:#1b1e22; --chrome-border:rgba(255,255,255,0.08); --chrome-muted:#8b8f96;
  --paper:#f5f4f0; --card:#ffffff;
  --ink:#22262b; --ink-muted:#6b7280;
  --line:rgba(34,38,43,0.10); --line2:rgba(34,38,43,0.18);
  --brand:#a6741f; --brand-light:#c98f2a; --brand-dim:rgba(166,116,31,0.10);
  --in-stock:#2f7a55; --in-stock-dim:rgba(47,122,85,0.12);
  --out-stock:#a8432f; --out-stock-dim:rgba(168,67,47,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}

.topnav{display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--chrome-border);padding:0 20px;height:58px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:34px;width:34px;object-fit:cover;border-radius:50%;}
.brand-text{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:19px;color:#fff;}
.admin-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brand-light);background:rgba(166,116,31,0.18);padding:3px 8px;margin-left:10px;}
.nav-links{margin-left:24px;display:flex;gap:4px;}
.nav-link{color:var(--chrome-muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-decoration:none;letter-spacing:.5px;padding:8px 12px;}
.nav-link:hover{color:#fff;}
.right-actions{margin-left:auto;display:flex;align-items:center;gap:14px;}

.content{max-width:860px;margin:0 auto;padding:28px 24px 80px;}
.page-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;}
.page-sub{font-size:13px;color:var(--ink-muted);margin-top:2px;margin-bottom:22px;}

.toolbar{display:flex;gap:10px;margin-bottom:14px;}
.search-input{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--ink);padding:9px 12px;font-size:13px;outline:none;}
.search-input:focus{border-color:var(--brand);}

.table-card{background:var(--card);border:1px solid var(--line2);}
table{width:100%;border-collapse:collapse;}
thead th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--paper);}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
.no-results{padding:32px 16px;text-align:center;color:var(--ink-muted);font-size:13px;}

.role-select{background:var(--card);border:1px solid var(--line2);color:var(--ink);padding:7px 10px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;outline:none;}
.role-select:focus{border-color:var(--brand);}
.role-select:disabled{opacity:.6;cursor:not-allowed;}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
.status-pill .dot{width:6px;height:6px;border-radius:50%;}
.status-pill.in{background:var(--in-stock-dim);color:var(--in-stock);}
.status-pill.in .dot{background:var(--in-stock);}
.you-tag{font-size:11px;color:var(--ink-muted);margin-left:8px;}

.info-note{background:var(--brand-dim);border:1px solid var(--brand);color:var(--brand);padding:12px 16px;font-size:12px;line-height:1.6;margin-bottom:20px;}

.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 20px;border:none;cursor:pointer;transition:all .15s;}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink-muted);}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}

.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;font-size:13px;border-radius:2px;display:none;z-index:1000;}
.toast.show{display:block;}
.toast.error{background:var(--out-stock);}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--chrome);padding:24px;}
.login-card{width:100%;max-width:360px;background:#22262b;border:1px solid var(--chrome-border);padding:36px 32px;text-align:center;}
.login-card img{width:70px;height:70px;object-fit:cover;border-radius:50%;margin:0 auto 16px;}
.login-card h1{font-family:'Big Shoulders Display',sans-serif;font-size:22px;color:#fff;}
.login-card p{font-size:12px;color:var(--chrome-muted);margin-top:6px;}
.login-field{margin:16px 0 10px;text-align:left;}
.login-field label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--chrome-muted);display:block;margin-bottom:5px;}
.login-field input{width:100%;background:#1b1e22;border:1px solid var(--chrome-border);color:#fff;padding:10px 12px;font-size:13px;outline:none;}
.btn-primary{background:var(--brand);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--brand-light);}

.denied-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:24px;text-align:center;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Same project as index.html — keep these in sync */
const SUPA_URL = 'https://cwhbchoffrtmjciiywps.supabase.co';
const SUPA_KEY = 'sb_publishable_q7FXk6h1FgHR8kNTUHZFdA_B7BxaUq5';
const LOGO_SRC = 'assets/logo.png';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const root = document.getElementById('root');

let allProfiles = [];
let currentUserId = null;

function showLogin(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <h1>Admin Access</h1>
        <p>Sign in to manage user roles</p>
        <form id="login-form">
          <div class="login-field"><label>Email</label><input type="email" id="email" required/></div>
          <div class="login-field"><label>Password</label><input type="password" id="password" required/></div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Sign In</button>
        </form>
        <p id="login-err" style="color:#c9756a;margin-top:12px;"></p>
      </div>
    </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) document.getElementById('login-err').textContent = error.message;
    else init();
  });
}

function showDenied(){
  root.innerHTML = `
    <div class="denied-screen">
      <div>
        <div class="page-title">Admins Only</div>
        <p class="page-sub">This page is for inventory admins. If that should be you, ask another admin to update your role.</p>
        <a href="index.html" class="nav-link" style="color:var(--brand);">← Back to Inventory</a>
      </div>
    </div>`;
}

function showToast(message, isError){
  let toast = document.getElementById('toast');
  if (!toast){
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

async function loadProfiles(){
  const { data, error } = await sb.from('profiles').select('*').order('email');
  allProfiles = (!error && data) ? data : [];
}

function renderRows(profiles){
  if (profiles.length === 0) return `<tr><td colspan="2" class="no-results">No users found.</td></tr>`;
  return profiles.map(p => {
    const isSelf = p.id === currentUserId;
    const roleCell = isSelf
      ? `<span class="status-pill in"><span class="dot"></span>${p.role}</span><span class="you-tag">(you — can't change your own role here)</span>`
      : `<select class="role-select" data-user-id="${p.id}">
           <option value="sales" ${p.role === 'sales' ? 'selected' : ''}>Sales</option>
           <option value="admin" ${p.role === 'admin' ? 'selected' : ''}>Admin</option>
         </select>`;
    return `<tr><td>${p.email || '— no email on record —'}</td><td>${roleCell}</td></tr>`;
  }).join('');
}

function applyFilter(){
  const q = document.getElementById('user-search').value.trim().toLowerCase();
  const filtered = !q ? allProfiles : allProfiles.filter(p => (p.email || '').toLowerCase().includes(q));
  document.getElementById('users-tbody').innerHTML = renderRows(filtered);
}

async function showManageUsers(){
  await loadProfiles();

  root.innerHTML = `
    <div class="topnav">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="The Product"/>
        <span class="brand-text">The Product</span>
        <span class="admin-tag">Admin</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Inventory</a>
        <a href="add-item.html" class="nav-link">+ Add Item</a>
        <a href="inventory-list.html" class="nav-link">Master List</a>
      </div>
      <div class="right-actions">
        <button class="btn btn-ghost" id="sign-out-btn">Sign Out</button>
      </div>
    </div>
    <div class="content">
      <div class="page-title">Manage Users</div>
      <div class="page-sub">Assign Admin or Sales access for existing team members.</div>

      <div class="info-note">
        This page only changes roles for accounts that already exist. To create a brand-new login for someone, that's still done directly in Supabase (Authentication → Users → Invite user).
      </div>

      <div class="toolbar">
        <input type="text" id="user-search" class="search-input" placeholder="Search by email…"/>
      </div>

      <div class="table-card">
        <table>
          <thead><tr><th>Email</th><th>Role</th></tr></thead>
          <tbody id="users-tbody">${renderRows(allProfiles)}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('sign-out-btn').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });
  document.getElementById('user-search').addEventListener('input', applyFilter);

  document.getElementById('users-tbody').addEventListener('change', async function(e){
    const select = e.target.closest('.role-select');
    if (!select) return;
    const userId = select.dataset.userId;
    const newRole = select.value;
    const profile = allProfiles.find(p => p.id === userId);
    const oldRole = profile ? profile.role : null;

    if (!confirm(`Change ${profile && profile.email ? profile.email : 'this user'} to ${newRole}?`)) {
      select.value = oldRole;
      return;
    }

    select.disabled = true;
    const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', userId);
    select.disabled = false;

    if (error){
      showToast('Could not update role: ' + error.message, true);
      select.value = oldRole;
      return;
    }

    if (profile) profile.role = newRole;
    showToast('Role updated.', false);
  });
}

async function init(){
  const { data: sessionData } = await sb.auth.getSession();
  if (!sessionData.session){ showLogin(); return; }
  currentUserId = sessionData.session.user.id;

  const { data: profile, error } = await sb.from('profiles').select('role').eq('id', currentUserId).single();
  if (error || !profile || profile.role !== 'admin'){ showDenied(); return; }

  showManageUsers();
}

init();
</script>
</body>
</html>
